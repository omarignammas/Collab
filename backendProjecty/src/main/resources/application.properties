spring.application.name=collab-backend

# Configuration PostgreSQL — env vars override these for Docker/Render, defaults keep local dev working
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/projectydb}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres123}

# JPA
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Global REST URL
BaseUrl=/api/v1

# Keys JWT
application.security.jwt.SECRET_KEY=${JWT_SECRET_KEY:44d287b7ee4ad66875f28ee32b64b7ab5448901f36800fbaf3b6216d4479270c}
application.security.jwt.EXPIRATION=${JWT_EXPIRATION:86400000}

# PostgreSQL Config
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# File uploads (avatars use their own tighter 2MB check in AvatarStorageService;
# this global ceiling just needs to be big enough for course-file PDFs/images)
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB
app.uploads.dir=${APP_UPLOADS_DIR:uploads}

# CORS — comma-separated list, set to the deployed frontend origin in production
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Actuator — health check only, no other management endpoints exposed
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
# Disable the mail health indicator in Render/deployed environments so startup health checks
# do not hang on outbound SMTP connectivity.
management.health.mail.enabled=${MANAGEMENT_HEALTH_MAIL_ENABLED:false}

# YouTube Data API v3 — used by playlist import. Leave the key blank to disable the
# feature gracefully (returns a clear "not configured" error instead of calling out).
app.youtube.api-key=${YOUTUBE_API_KEY:}
app.youtube.base-url=${YOUTUBE_API_BASE_URL:https://www.googleapis.com/youtube/v3}

# Groq API (OpenAI-compatible) — used for AI-generated summaries, quizzes, and
# Focus Room session reports. Leave the key blank to disable AI features
# gracefully (generation just stays in a FAILED state, silently).
# Default text model avoids llama-3.3-70b-versatile — Groq has it scheduled
# for shutdown; openai/gpt-oss-120b is the current recommended replacement.
# qwen/qwen3.6-27b is Groq's only active vision-capable model as of writing.
app.llm.api-key=${GROQ_API_KEY:}
app.llm.base-url=${LLM_API_BASE_URL:https://api.groq.com/openai/v1}
app.llm.model=${LLM_MODEL:openai/gpt-oss-120b}
app.llm.vision-model=${LLM_VISION_MODEL:qwen/qwen3.6-27b}

# Outbound mail — used only for the desktop-app waitlist notification. Defaults to
# Gmail's SMTP relay since the notify address is a Gmail account; MAIL_USERNAME must
# be that same Gmail address and MAIL_PASSWORD a Google Account App Password (not the
# normal login password — Gmail SMTP auth requires 2-Step Verification + an App
# Password, generated at myaccount.google.com/apppasswords). Left blank, waitlist
# signups still save to the database — WaitlistService just skips sending the email
# and logs a warning instead of failing the signup.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.waitlist.notify-email=${WAITLIST_NOTIFY_EMAIL:omar.ignammas2003@gmail.com}
