name: Build Collab Desktop

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target universal-apple-darwin"

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontendProjecty/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontendProjecty
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: frontendProjecty
          args: ${{ matrix.args }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: collab-${{ matrix.platform }}
          path: |
            frontendProjecty/src-tauri/target/release/bundle/**/*.dmg
            frontendProjecty/src-tauri/target/**/release/bundle/**/*.dmg
            frontendProjecty/src-tauri/target/release/bundle/**/*.msi
            frontendProjecty/src-tauri/target/release/bundle/**/*.exe
          if-no-files-found: ignore
