name: Build Collab Desktop

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target universal-apple-darwin"

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontendProjecty/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontendProjecty
        run: npm ci

      # Every workflow run gets a new app version. This makes macOS replace the
      # installed bundle instead of treating a new build as the old 0.1.0 app.
      - name: Set unique desktop build version
        shell: bash
        env:
          RELEASE_VERSION: 0.1.${{ github.run_number }}
        run: |
          node --input-type=module -e '
            import fs from "node:fs";

            const version = process.env.RELEASE_VERSION;
            if (!/^\d+\.\d+\.\d+$/.test(version)) {
              throw new Error(`Invalid release version: ${version}`);
            }

            const configPath = "frontendProjecty/src-tauri/tauri.conf.json";
            const config = JSON.parse(fs.readFileSync(configPath, "utf8"));
            config.version = version;
            fs.writeFileSync(configPath, `${JSON.stringify(config, null, 2)}\n`);

            const cargoPath = "frontendProjecty/src-tauri/Cargo.toml";
            const cargo = fs.readFileSync(cargoPath, "utf8");
            const updatedCargo = cargo.replace(
              /^(version\s*=\s*)"[^"]+"$/m,
              `$1"${version}"`,
            );
            if (updatedCargo === cargo) {
              throw new Error("Could not update the desktop package version.");
            }
            fs.writeFileSync(cargoPath, updatedCargo);
          '

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: frontendProjecty
          args: ${{ matrix.args }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: collab-${{ matrix.platform }}-${{ github.run_number }}
          path: |
            frontendProjecty/src-tauri/target/release/bundle/**/*.dmg
            frontendProjecty/src-tauri/target/**/release/bundle/**/*.dmg
            frontendProjecty/src-tauri/target/release/bundle/**/*.msi
            frontendProjecty/src-tauri/target/release/bundle/**/*.exe
          if-no-files-found: ignore
